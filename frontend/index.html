<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isochrone – Travel-Time Map</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Isochrone – Travel-Time Map</h1>
<p class="hint">Generates a travel-time map from any point (latitude/longitude).</p>

<form id="render-form">
  <div class="field-row">
    <label for="lat">Latitude (lat)</label>
    <input type="number" id="lat" name="lat" step="any" min="-90" max="90" value="48.85" required>
  </div>
  <div class="field-row">
    <label for="lon">Longitude (lon)</label>
    <input type="number" id="lon" name="lon" step="any" min="-180" max="180" value="2.35" required>
  </div>
  <div class="field-row">
    <label for="label">Label (optional)</label>
    <input type="text" id="label" name="label" placeholder="e.g. Paris">
  </div>
  <div class="field-row">
    <label for="resolution">H3 resolution</label>
    <select id="resolution" name="resolution">
      <option value="0">0 (coarsest)</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4" selected>4 (default)</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
    </select>
  </div>
  <div class="field-row">
    <label for="cmap">Colormap</label>
    <select id="cmap" name="cmap">
      <option value="">Default (viridis_r, or galton with Galton mode)</option>
      <option value="viridis_r">viridis_r</option>
      <option value="viridis">viridis</option>
      <option value="plasma_r">plasma_r</option>
      <option value="plasma">plasma</option>
      <option value="inferno_r">inferno_r</option>
      <option value="inferno">inferno</option>
      <option value="magma_r">magma_r</option>
      <option value="magma">magma</option>
      <option value="cividis_r">cividis_r</option>
      <option value="cividis">cividis</option>
      <option value="galton">galton (retro, ten fixed colors)</option>
      <option value="galton5">galton5 (retro, five fixed colors)</option>
    </select>
  </div>
  <div class="field-row">
    <label for="max_hours">Max. hours (--max-hours)</label>
    <input type="number" id="max_hours" name="max_hours" step="any" min="0" placeholder="48">
  </div>
  <div class="field-row">
    <label for="galton_sigma">Galton smoothing radius, degrees (--galton-sigma)</label>
    <input type="number" id="galton_sigma" name="galton_sigma" step="any" min="0" max="20" placeholder="3.0">
  </div>
  <div class="field-row">
    <label for="dpi">DPI</label>
    <input type="number" id="dpi" name="dpi" min="36" max="300" value="150">
  </div>
  <div class="field-row">
    <label for="paper">Paper size (optional)</label>
    <input type="text" id="paper" name="paper" placeholder="e.g. a4 or 30x20">
  </div>
  <div class="field-row checkbox-row">
    <label><input type="checkbox" id="galton" name="galton"> Galton mode</label>
    <label><input type="checkbox" id="title" name="title"> Show title</label>
    <label><input type="checkbox" id="rivers" name="rivers"> Rivers</label>
    <label><input type="checkbox" id="ports" name="ports"> Ports</label>
    <label><input type="checkbox" id="airports" name="airports"> Airports</label>
    <label><input type="checkbox" id="james_bond" name="james_bond"> James Bond mode (heli + jetpack)</label>
  </div>
  <button type="submit" id="submit-btn">Render map</button>
</form>

<div id="progress-container" hidden>
  <div id="progress-bar-outer">
    <div id="progress-bar-inner"></div>
  </div>
  <p id="progress-message"></p>
</div>

<div id="result-container"></div>

<script src="app.js"></script>
</body>
</html>
